name: gemini-audio-mcp
version: 0.1.0
description: High-performance MCP server for Gemini 2.5 Native Audio and Lyria 3 music generation. Requires FFmpeg installed on the system.
readme: README.md
author: jxoesneon
license: MIT
repository: https://github.com/jxoesneon/gemini-audio-mcp
mcp:
  version: 2024-11-05
  tools:
    - name: generate_soundscape
      description: Generates immersive environmental soundscapes using Gemini 2.0 Live.
    - name: generate_voice
      description: Generates expressive speech and narration from text using Gemini 2.5 Native Audio.
    - name: generate_music
      description: Generates full songs, loops, or musical segments via Lyria 3 (PAID).
    - name: generate_sfx
      description: Generates short sound effects and foley via Lyria 3 Clip.
    - name: transition_soundscape
      description: Generates two soundscapes and crossfades between them.
    - name: configure
      description: View or update persistent configuration and defaults.
    - name: play_audio
      description: Plays an audio file using the system's default player.
    - name: cleanup_assets
      description: Deletes generated audio files older than a specified age.
    - name: check_dependencies
      description: Checks if external dependencies like FFmpeg are installed.
install:
  - type: cargo
    command: cargo install --path .
environment:
  GEMINI_API_KEY:
    description: Your Google API Key.
    required: true
