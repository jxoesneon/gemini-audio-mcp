name: PR Labeler

on:
  pull_request_target:
    branches: [ "master", "main" ]

permissions:
  contents: read
  pull_requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v5
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          sync-labels: true
