name: Bug Report
description: File a report to help us improve
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us what you expected to happen
      placeholder: Tell us what you did and what went wrong
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Please copy and paste any relevant log output.
      render: shell
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Rust version, FFmpeg version
      placeholder: e.g. macOS 14.4, Rust 1.77, FFmpeg 6.1
    validations:
      required: true
