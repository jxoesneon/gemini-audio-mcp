[package]
name = "gemini-audio-mcp"
version = "0.1.1"
edition = "2021"
authors = ["jxoesneon"]
description = "High-performance Model Context Protocol (MCP) server for Gemini 2.5 and Lyria 3 audio synthesis."
license = "MIT"
repository = "https://github.com/jxoesneon/gemini-audio-mcp"
homepage = "https://github.com/jxoesneon/gemini-audio-mcp"
keywords = ["mcp", "gemini", "audio", "music", "lyria"]
categories = ["multimedia::audio", "ai"]
readme = "README.md"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.29", features = ["native-tls"] }
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
uuid = { version = "1.23", features = ["v4"] }
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = "0.3"
reqwest = { version = "0.13.4", features = ["json"] }
bson = { version = "3.1.0", features = ["serde", "serde_json-1"] }
dirs = "6.0.0"
